name: Deploy VoiceNoteWeb to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - "VoiceNoteWeb/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VoiceNoteWeb

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: VoiceNoteWeb/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools@13 deploy --only hosting --project voice-notes-54e1a --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
